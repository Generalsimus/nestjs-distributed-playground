# ── NATS Server Configuration ─────────────────────────────────────────────────

# Server identity (required when JetStream + cluster are both enabled)
server_name: "nats-1"

# Client & monitoring ports
port: 4222
http_port: 8222

# ── JetStream ──────────────────────────────────────────────────────────────────
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1073741824   # 1 GB in-memory storage
  max_file_store: 10737418240    # 10 GB file-based storage
  max_outstanding_catchup: 67108864
}

# ── Authentication ──────────────────────────────────────────────────────────────
authorization {
  user:     "appuser"
  password: "appsecret"
  timeout:  2
}

# ── Cluster (disabled for single-node; uncomment + add routes for HA) ──────────
# cluster {
#   name: "microservices-cluster"
#   port: 6222
#   routes: [ nats://nats-2:6222, nats://nats-3:6222 ]
# }

# ── Resource limits ─────────────────────────────────────────────────────────────
max_connections:    1000
max_subscriptions:  0       # 0 = unlimited
max_payload:        1048576 # 1 MB
max_pending:        67108864

# ── TLS (disabled for local dev; enable for production) ────────────────────────
# tls {
#   cert_file:  "/etc/nats/tls/server.crt"
#   key_file:   "/etc/nats/tls/server.key"
#   ca_file:    "/etc/nats/tls/ca.crt"
#   verify:     true
#   timeout:    2
# }

# ── Logging ─────────────────────────────────────────────────────────────────────
logtime: true
debug:   false
trace:   false
